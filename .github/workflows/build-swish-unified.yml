name: Build unified SWISH testing artifacts
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        required: true
        default: preview-unified
        options: [preview-unified, production-unified]
      production_acceptance_run:
        type: string
        required: false
        description: Successful protected current-source acceptance run (production only)
      quick_test_apk:
        type: boolean
        default: false
        description: Skip unrelated regression gates for preview Android testing only
      build_android:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: false
  workflow_call:
    inputs:
      quick_test_apk:
        type: boolean
        default: false
      production_acceptance_run:
        type: string
        default: ''
      channel:
        type: string
        default: preview-unified
      build_android:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SWISH_PRODUCTION_ACCEPTANCE_RUN: ${{ inputs.production_acceptance_run }}
      GH_TOKEN: ${{ github.token }}
      SWISH_NICHE: ''
      SWISH_MASTER_ADMIN: '0'
      SWISH_TEST_LAB: '0'
      SWISH_RELEASE_CHANNEL: ${{ inputs.channel }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID || vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Reject quick testing mode for production or iOS
        if: ${{ inputs.quick_test_apk && (inputs.channel != 'preview-unified' || inputs.build_ios || !inputs.build_android) }}
        run: exit 1
      - uses: actions/checkout@v4
      - name: Resolve existing public OnSpace configuration from checked-in .env
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('.env', 'utf8');
          const values = Object.fromEntries(source.split(/\r?\n/).filter(line => /^[A-Za-z_][A-Za-z0-9_]*=/.test(line)).map(line => {
            const index = line.indexOf('=');
            return [line.slice(0, index), line.slice(index + 1).trim().replace(/^["']|["']$/g, '')];
          }));
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) {
            const value = process.env[key] || values[key];
            if (!value || /[\r\n]/.test(value)) throw Error('Missing valid public OnSpace configuration: ' + key);
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve inspected original Android signing identity
        if: inputs.build_android
        env:
          SWISH_RELEASE_KEYSTORE_BASE64: ${{ secrets.SWISH_RELEASE_KEYSTORE_BASE64 }}
          SWISH_KEYSTORE_STORE_PASSWORD: ${{ secrets.SWISH_KEYSTORE_STORE_PASSWORD }}
          SWISH_KEYSTORE_KEY_PASSWORD: ${{ secrets.SWISH_KEYSTORE_KEY_PASSWORD }}
          SWISH_KEYSTORE_KEY_ALIAS: ${{ secrets.SWISH_KEYSTORE_KEY_ALIAS }}
          SWISH_RELEASE_CERT_SHA256: ${{ vars.SWISH_RELEASE_CERT_SHA256 || secrets.SWISH_RELEASE_CERT_SHA256 }}
        run: bash scripts/resolve-android-signing.sh
      - run: bash scripts/install-dependencies.sh
      - run: node scripts/verify-production-approval.mjs
      - name: Verify authenticated access to the approved existing Expo project
        run: node scripts/verify-expo-project.mjs
      - name: Require an update-enabled configuration before compiling any release
        run: |
          mkdir -p dist
          npx expo config --type public --json > dist/unified-runtime-config.json
          node scripts/verify-unified-config.mjs dist/unified-runtime-config.json
          node --test scripts/unified-ota-policy.test.mjs scripts/android-release-policy.test.mjs scripts/release-workflow-contract.test.mjs
      - run: node scripts/generate-unified-route-types.cjs
      - name: typescript (mandatory)
        if: ${{ !inputs.quick_test_apk }}
        run: |
          set -o pipefail
          mkdir -p dist
          npx tsc --noEmit 2>&1 | tee dist/unified-typescript.log
      - name: lint (mandatory)
        if: ${{ !inputs.quick_test_apk }}
        run: |
          set -o pipefail
          mkdir -p dist
          npx expo lint 2>&1 | tee dist/unified-lint.log
      - name: unit (mandatory)
        if: ${{ !inputs.quick_test_apk }}
        run: |
          set -o pipefail
          mkdir -p dist
          npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand 2>&1 | tee dist/unified-unit.log
      - if: ${{ !inputs.quick_test_apk }}
        run: node scripts/validate-unified-modules.mjs
      - if: ${{ !inputs.quick_test_apk }}
        run: node scripts/sync-backend-registry.mjs --check
      - name: Export shared browser experience without publishing
        if: ${{ !inputs.quick_test_apk }}
        run: npx expo export --platform web --output-dir dist/unified-web
      - name: Retain website artifact and source evidence
        if: ${{ !inputs.quick_test_apk }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/unified-web-source-sha.txt
          tar -czf dist/unified-web.tar.gz -C dist unified-web
          sha256sum dist/unified-web.tar.gz > dist/unified-web.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.quick_test_apk }}
        with:
          name: swish-unified-web
          path: |
            dist/unified-web
            dist/unified-web.tar.gz
            dist/unified-web.sha256
            dist/unified-web-source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swish-unified-source-diagnostics
          path: dist/*.log
          if-no-files-found: ignore
  android:
    needs: verify
    if: inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SWISH_PRODUCTION_ACCEPTANCE_RUN: ${{ inputs.production_acceptance_run }}
      GH_TOKEN: ${{ github.token }}
      SWISH_NICHE: ''
      SWISH_MASTER_ADMIN: '0'
      SWISH_TEST_LAB: '0'
      SWISH_RELEASE_CHANNEL: ${{ inputs.channel }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID || vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      SWISH_RELEASE_KEYSTORE_BASE64: ${{ secrets.SWISH_RELEASE_KEYSTORE_BASE64 }}
      SWISH_KEYSTORE_STORE_PASSWORD: ${{ secrets.SWISH_KEYSTORE_STORE_PASSWORD }}
      SWISH_KEYSTORE_KEY_PASSWORD: ${{ secrets.SWISH_KEYSTORE_KEY_PASSWORD }}
      SWISH_KEYSTORE_KEY_ALIAS: ${{ secrets.SWISH_KEYSTORE_KEY_ALIAS }}
      SWISH_RELEASE_CERT_SHA256: ${{ vars.SWISH_RELEASE_CERT_SHA256 || secrets.SWISH_RELEASE_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing public OnSpace configuration from checked-in .env
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('.env', 'utf8');
          const values = Object.fromEntries(source.split(/\r?\n/).filter(line => /^[A-Za-z_][A-Za-z0-9_]*=/.test(line)).map(line => {
            const index = line.indexOf('=');
            return [line.slice(0, index), line.slice(index + 1).trim().replace(/^["']|["']$/g, '')];
          }));
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) {
            const value = process.env[key] || values[key];
            if (!value || /[\r\n]/.test(value)) throw Error('Missing valid public OnSpace configuration: ' + key);
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash scripts/install-dependencies.sh
      - name: Use GitHub runner Android SDK and install required packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDK_MANAGER" && test -x "$SDK_MANAGER" || { echo "Android SDK command-line tools unavailable"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Initialize binary inspection tools
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          python3 -m venv "$RUNNER_TEMP/apk-inspector"
          "$RUNNER_TEMP/apk-inspector/bin/pip" install androguard==4.1.3
          echo "SWISH_APK_PYTHON=$RUNNER_TEMP/apk-inspector/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/apk-inspector/bin/python" scripts/inspect-unified-apk.test.py
      - name: Resolve inspected original Android signing identity
        run: bash scripts/resolve-android-signing.sh
      - name: Verify unified app identity and update configuration
        run: |
          mkdir -p dist
          npx expo config --type public --json > dist/unified-runtime-config.json
          node scripts/verify-unified-config.mjs dist/unified-runtime-config.json
          npx --no-install expo-updates runtimeversion:resolve --platform android --workflow managed > dist/unified-android-runtime.json
      - name: Generate native project with preserved package identity
        run: npx expo prebuild --platform android --clean
      - run: node scripts/verify-android-sdk-config.mjs
      - run: node scripts/configure-niche-signing.mjs
      - name: Compile single APK
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" 2>&1 | tee ../dist/unified-android-build.log
      - name: Verify actual APK, certificate and runtime; retain checksums
        run: bash scripts/verify-unified-apk.sh android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swish-unified-android
          path: |
            dist/swish-unified.apk
            dist/swish-unified.sha256
            dist/unified-android-evidence.json
            dist/unified-signature.txt
            dist/unified-badging.txt
            dist/unified-runtime-config.json
            dist/unified-android-runtime.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swish-unified-android-diagnostics
          path: dist/unified-android-build.log
          if-no-files-found: warn
  ios:
    needs: verify
    if: inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID || vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      SWISH_PRODUCTION_ACCEPTANCE_RUN: ${{ inputs.production_acceptance_run }}
      GH_TOKEN: ${{ github.token }}
      SWISH_NICHE: ''
      SWISH_MASTER_ADMIN: '0'
      SWISH_TEST_LAB: '0'
      SWISH_RELEASE_CHANNEL: ${{ inputs.channel }}
      SWISH_IOS_PROFILE: ${{ inputs.channel == 'production-unified' && 'unified-store' || 'unified-ios-testing' }}
      SWISH_APPROVED_IOS_BUNDLE_ID: ${{ vars.SWISH_APPROVED_IOS_BUNDLE_ID }}
      SWISH_APPROVED_IOS_TEAM_ID: ${{ vars.SWISH_APPROVED_IOS_TEAM_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve existing public OnSpace configuration from checked-in .env
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('.env', 'utf8');
          const values = Object.fromEntries(source.split(/\r?\n/).filter(line => /^[A-Za-z_][A-Za-z0-9_]*=/.test(line)).map(line => {
            const index = line.indexOf('=');
            return [line.slice(0, index), line.slice(index + 1).trim().replace(/^["']|["']$/g, '')];
          }));
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) {
            const value = process.env[key] || values[key];
            if (!value || /[\r\n]/.test(value)) throw Error('Missing valid public OnSpace configuration: ' + key);
            fs.appendFileSync(process.env.GITHUB_ENV, key + '=' + value + '\n');
          }
          NODE
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/install-dependencies.sh
      - name: Require existing approved iOS identity and credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo 'Missing owner-authorized EAS access'; exit 1; }
          mkdir -p dist
          npx expo config --type public --json > dist/unified-runtime-config.json
          node scripts/verify-unified-config.mjs dist/unified-runtime-config.json ios
      - name: Build with existing remote credentials only; do not submit or reset provisioning
        run: npx --yes eas-cli@27.2.0 build --platform ios --profile "$SWISH_IOS_PROFILE" --non-interactive --wait --json > dist/unified-ios-build.json
      - name: Download and inspect the actual existing-identity iOS artifact
        run: node scripts/verify-unified-ios.mjs dist/unified-ios-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: swish-unified-ios
          path: |
            dist/swish-unified.ipa
            dist/unified-ios-evidence.json
            dist/unified-ios-build.json
            dist/unified-runtime-config.json
            dist/swish-unified-ipa.sha256
          if-no-files-found: error
# No OTA publication, App Store submission, Google Play upload or database writes.
