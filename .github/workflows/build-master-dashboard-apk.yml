name: Build SWISH Master Dashboard APK

on:
  push:
    branches: [feat/master-dashboard-apk]
    paths:
      - 'app/master-dashboard/**'
      - 'app.config.js'
      - '.github/workflows/build-master-dashboard-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/master-dashboard/**'
      - 'app.config.js'
      - 'scripts/install-dependencies.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-master-dashboard-apk.yml'

permissions:
  contents: read

jobs:
  build-master-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bash scripts/install-dependencies.sh

      - name: Stage isolated dashboard routes
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/app || { echo "Refusing to overwrite existing src/app route tree"; exit 1; }
          mkdir -p src
          cp -R app/master-dashboard src/app
          test -s src/app/index.tsx
          test -s src/app/login.tsx
          test -s src/app/_layout.tsx
          if find src/app -type f | grep -E 'lot-opportunity|coin|clothing|motocross|bicycle'; then
            echo "Unexpected non-dashboard route staged"; exit 1
          fi
          echo "Staged isolated route tree:"
          find src/app -maxdepth 2 -type f -print | sort

      - name: TypeScript validation
        run: npx tsc --noEmit --project tsconfig.master-dashboard.json

      - name: Regression tests
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand services/__tests__/brandedBuildConfig.test.ts

      - name: Verify isolated master app identity and route root
        env:
          SWISH_MASTER_DASHBOARD: '1'
        run: |
          npx expo config --type public --json > /tmp/master-expo-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/master-expo-config.json', 'utf8'));
          const router = (config.plugins || []).find(p => (Array.isArray(p) ? p[0] : p) === 'expo-router');
          if (config.name !== 'SWISH Master') throw new Error('Unexpected app name: ' + config.name);
          if (config.android?.package !== 'com.swish.masterdashboard') throw new Error('Unexpected Android package: ' + config.android?.package);
          if (config.extra?.swishMasterDashboard !== true) throw new Error('Master dashboard identity flag missing');
          if (Array.isArray(router) && router[1]?.root) throw new Error('Master build must use default Expo Router root; src/app staging isolates the routes.');
          for (const route of ['index.tsx', 'login.tsx', '_layout.tsx']) {
            if (!fs.existsSync('src/app/' + route)) throw new Error('Missing staged dashboard route: ' + route);
          }
          if (fs.existsSync('src/app/lot-opportunity.tsx')) throw new Error('Main-app legacy route leaked into dashboard build.');
          console.log('Master dashboard identity and isolated src/app route tree verified.');
          NODE

      - name: Generate Android project
        env:
          SWISH_MASTER_DASHBOARD: '1'
        run: npx expo prebuild --platform android --clean

      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process

      - name: Verify APK and package identity
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -F "package: name='com.swish.masterdashboard'"
          else
            echo "aapt unavailable; Expo config identity was validated before build."
          fi
          mkdir -p dist
          cp "$APK" dist/swish-master-dashboard.apk
          sha256sum dist/swish-master-dashboard.apk > dist/swish-master-dashboard.sha256
          file dist/swish-master-dashboard.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: swish-master-dashboard-apk
          path: |
            dist/swish-master-dashboard.apk
            dist/swish-master-dashboard.sha256
          if-no-files-found: error
          retention-days: 14
