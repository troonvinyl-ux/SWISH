name: Build signed SWISH APK (CI-generated keystore)

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/swish-release.keystore \
            -alias swish \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "swish123" \
            -keypass "swish123" \
            -dname "CN=SWISH, OU=Mobile, O=SWISH, L=London, S=London, C=GB"

      - name: Configure Gradle signing
        run: |
          cat > android/app/build.gradle <<'EOF'
          apply plugin: "com.android.application"
          apply plugin: "org.jetbrains.kotlin.android"
          apply plugin: "expo-module-gradle-plugin"
          apply plugin: "com.facebook.react"

          def projectRoot = rootProject.projectDir

          android {
            ndkVersion rootProject.ext.ndkVersion
            compileSdkVersion rootProject.ext.compileSdkVersion

            namespace 'com.swish.inventory'
            defaultConfig {
              applicationId 'com.swish.inventory'
              minSdkVersion rootProject.ext.minSdkVersion
              targetSdkVersion rootProject.ext.targetSdkVersion
              versionCode 1
              versionName "1.0.0"
            }

            signingConfigs {
              release {
                storeFile file("swish-release.keystore")
                storePassword "swish123"
                keyAlias "swish"
                keyPassword "swish123"
              }
            }

            buildTypes {
              debug {
                signingConfig signingConfigs.debug
              }
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
              }
            }
          }

          repositories {
            google()
            mavenCentral()
          }

          dependencies {
            implementation project(':expo')
            implementation project(':react-native-gesture-handler')
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swish-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated keystore
        uses: actions/upload-artifact@v4
        with:
          name: swish-keystore
          path: android/app/swish-release.keystore
          if-no-files-found: error
