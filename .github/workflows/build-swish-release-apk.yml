name: Build signed SWISH APK (persistent keystore)

# ──────────────────────────────────────────────────────────────────────────────
# REQUIRED GITHUB SECRETS:
#
#   SWISH_RELEASE_KEYSTORE_BASE64
#     Base64-encoded release keystore file.
#     Generate once locally:
#       keytool -genkeypair -v \
#         -keystore swish-release.keystore \
#         -alias swish \
#         -keyalg RSA -keysize 2048 -validity 10000 \
#         -storepass <YOUR_STORE_PASS> \
#         -keypass <YOUR_KEY_PASS> \
#         -dname "CN=SWISH, OU=Mobile, O=SWISH, L=London, S=London, C=GB"
#       base64 -w 0 swish-release.keystore > keystore.b64
#     Then store the contents of keystore.b64 as this secret.
#     KEEP THE KEYSTORE FILE SAFE — losing it means you cannot update the app.
#
#   SWISH_KEYSTORE_STORE_PASSWORD
#     The -storepass value chosen when the keystore was generated.
#
#   SWISH_KEYSTORE_KEY_PASSWORD
#     The -keypass value chosen when the keystore was generated.
#     (Usually the same as store password for a single-key keystore.)
#
#   SWISH_KEYSTORE_KEY_ALIAS
#     The -alias value (e.g. "swish").
#
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - 'release/master-admin-*'
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: bash scripts/install-dependencies.sh

      - name: Run niche isolation and Coin Flipper production tests (pre-build gate)
        # Fails the build before any Android toolchain setup if niche isolation
        # or Coin Flipper production regressions are detected.
        # Keeps CI fast — tests run in ~20-30s total.
        run: |
          set -eux
          npx jest --coverage --coverageDirectory=coverage/pre-build \
            services/__tests__/nicheIsolation.test.ts \
            services/__tests__/coinFlipperProduction.test.ts 2>&1
          echo "Pre-build gate tests PASSED — proceeding to Android build."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          curl -fLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate owner-only Master Admin Android project
        env:
          SWISH_MASTER_ADMIN: '1'
          EXPO_NO_DOTENV: '1'
        run: pnpm exec expo prebuild --platform android --clean

      - name: Verify Android 16 SDK configuration
        run: node scripts/verify-android-sdk-config.mjs

      - name: Restore persistent release keystore from secret
        # Decodes the base64 keystore stored in GitHub Secrets.
        # The keystore is NOT generated fresh each build — it is the same
        # persistent key that was registered with the Play Store.
        env:
          KEYSTORE_B64: ${{ secrets.SWISH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -eu
          set +x
          if [ -z "${KEYSTORE_B64}" ]; then
            echo "ERROR: SWISH_RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "Generate a keystore once, base64-encode it, and store the result as this secret."
            exit 1
          fi
          echo "${KEYSTORE_B64}" | base64 --decode > android/app/swish-release.keystore
          echo "Keystore restored ($(wc -c < android/app/swish-release.keystore) bytes)"

      - name: Validate keystore secrets are present
        env:
          STORE_PASS: ${{ secrets.SWISH_KEYSTORE_STORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.SWISH_KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS:  ${{ secrets.SWISH_KEYSTORE_KEY_ALIAS }}
        run: |
          set -eu
          set +x
          if [ -z "${STORE_PASS}" ] || [ -z "${KEY_PASS}" ] || [ -z "${KEY_ALIAS}" ]; then
            echo "ERROR: One or more keystore secrets are missing."
            echo "Required: SWISH_KEYSTORE_STORE_PASSWORD, SWISH_KEYSTORE_KEY_PASSWORD, SWISH_KEYSTORE_KEY_ALIAS"
            exit 1
          fi
          echo "All keystore secrets present."

      - name: Patch Android app build.gradle for release signing (idempotent)
        working-directory: ${{ github.workspace }}
        env:
          KEY_ALIAS:  ${{ secrets.SWISH_KEYSTORE_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SWISH_KEYSTORE_STORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.SWISH_KEYSTORE_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import sys
          import os
          import re
          from pathlib import Path

          GRADLE_PATH = Path('android/app/build.gradle')
          if not GRADLE_PATH.exists():
              print('ERROR: android/app/build.gradle not found')
              sys.exit(1)

          KEYS = {
              'keystore': 'swish-release.keystore',
              'alias':    os.environ['KEY_ALIAS'],
              'storepass': os.environ['STORE_PASS'],
              'keypass':   os.environ['KEY_PASS'],
          }

          def find_block(text, start_idx):
              i, depth, n = start_idx, 0, len(text)
              while i < n:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def locate_keyword_block(text, keyword):
              m = re.search(r'{}\s*\{{'.format(re.escape(keyword)), text)
              if not m:
                  return None
              open_brace_idx = text.find('{', m.end()-1)
              close_brace_idx = find_block(text, open_brace_idx)
              if close_brace_idx == -1:
                  return None
              return (m.start(), open_brace_idx, close_brace_idx)

          RELEASE_BLOCK = (
              'release {\n'
              '            storeFile file("{keystore}")\n'
              '            storePassword "{storepass}"\n'
              '            keyAlias "{alias}"\n'
              '            keyPassword "{keypass}"\n'
              '        }'
          ).format(**KEYS)

          def ensure_signing_configs(text):
              loc = locate_keyword_block(text, 'signingConfigs')
              if loc:
                  s_start, s_open, s_close = loc
                  signing_block = text[s_open+1:s_close]
                  rel_match = re.search(r'release\s*\{', signing_block)
                  if rel_match:
                      rel_open_in_block = signing_block.find('{', rel_match.end()-1)
                      rel_open_idx = s_open + 1 + rel_open_in_block
                      rel_close_idx = find_block(text, rel_open_idx)
                      if rel_close_idx == -1:
                          return None, False, 'Malformed release block in signingConfigs'
                      sb_before = text[s_open+1:rel_open_idx]
                      sb_after  = text[rel_close_idx+1:s_close]
                      new_signing = sb_before + RELEASE_BLOCK + sb_after
                      new_text = text[:s_open+1] + new_signing + text[s_close:]
                      return new_text, True, 'Updated existing signingConfigs.release'
                  insert = '\n        ' + RELEASE_BLOCK + '\n'
                  new_text = text[:s_close] + insert + text[s_close:]
                  return new_text, True, 'Inserted release block into signingConfigs'

              bt_loc = text.find('    buildTypes {')
              if bt_loc != -1:
                  insert = (
                      '    signingConfigs {{\n'
                      '        {block}\n'
                      '    }}\n\n'
                  ).format(block=RELEASE_BLOCK.replace('\n', '\n        '))
                  new_text = text.replace('    buildTypes {', insert + '    buildTypes {', 1)
                  return new_text, True, 'Inserted signingConfigs before buildTypes'

              return None, False, "Could not find 'buildTypes {' marker"

          def ensure_release_buildtype(text):
              bt_loc = locate_keyword_block(text, 'buildTypes')
              if not bt_loc:
                  return None, False, 'Could not locate buildTypes block'
              _, bt_open, bt_close = bt_loc
              bt_text = text[bt_open+1:bt_close]
              m = re.search(r'release\s*\{', bt_text)
              if not m:
                  return None, False, 'No release buildType found'
              rel_open_in_bt = bt_text.find('{', m.end()-1)
              rel_open_idx = bt_open + 1 + rel_open_in_bt
              rel_close_idx = find_block(text, rel_open_idx)
              if rel_close_idx == -1:
                  return None, False, 'Malformed release block'
              release_inner = text[rel_open_idx+1:rel_close_idx]
              if 'signingConfig signingConfigs.release' in release_inner:
                  return text, False, 'release buildType already uses signingConfigs.release'
              if 'signingConfig signingConfigs.debug' in release_inner:
                  new_inner = release_inner.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              else:
                  new_inner = '\n            signingConfig signingConfigs.release\n' + release_inner
              new_text = text[:rel_open_idx+1] + new_inner + text[rel_close_idx:]
              return new_text, True, 'Updated release buildType to use signingConfigs.release'

          for pass_num in range(2):
              text = GRADLE_PATH.read_text()
              new_text, changed, msg = ensure_signing_configs(text)
              if new_text is None:
                  print('ERROR:', msg)
                  raise SystemExit(1)
              if changed:
                  GRADLE_PATH.write_text(new_text)
              print('INFO (signing_configs pass {}):'.format(pass_num + 1), msg)

              text = GRADLE_PATH.read_text()
              final_text, changed2, msg2 = ensure_release_buildtype(text)
              if final_text is None:
                  print('ERROR:', msg2)
                  raise SystemExit(1)
              if changed2:
                  GRADLE_PATH.write_text(final_text)
              print('INFO (release_buildtype pass {}):'.format(pass_num + 1), msg2)

          print('Patch completed successfully.')
          raise SystemExit(0)
          PY

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Verify signed owner-only Master Admin artifact
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: bash scripts/verify-master-admin-apk.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swish-master-admin-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # NOTE: The keystore is NOT uploaded as a build artifact.
      # The keystore lives exclusively in GitHub Secrets (SWISH_RELEASE_KEYSTORE_BASE64)
      # and is restored from there on each build run.
      # Never commit the keystore file to the repository.
