name: Build signed SWISH APK (CI-generated keystore)

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          curl -fLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/swish-release.keystore \
            -alias swish \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "swish123" \
            -keypass "swish123" \
            -dname "CN=SWISH, OU=Mobile, O=SWISH, L=London, S=London, C=GB"

      - name: Patch Android app build.gradle for release signing (robust idempotent)
        working-directory: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import sys
          import re
          from pathlib import Path

          GRADLE_PATH = Path('android/app/build.gradle')
          if not GRADLE_PATH.exists():
              print('ERROR: android/app/build.gradle not found')
              sys.exit(0)

          KEYS = {
              'keystore': 'swish-release.keystore',
              'alias': 'swish',
              'password': 'swish123'
          }

          def find_block(text, start_idx):
              i = start_idx
              depth = 0
              n = len(text)
              while i < n:
                  if text[i] == '{':
                      depth += 1
                  elif text[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              return -1

          def locate_keyword_block(text, keyword):
              m = re.search(r'{}\s*\{{'.format(re.escape(keyword)), text)
              if not m:
                  return None
              open_brace_idx = text.find('{', m.end()-1)
              close_brace_idx = find_block(text, open_brace_idx)
              if close_brace_idx == -1:
                  return None
              return (m.start(), open_brace_idx, close_brace_idx)

          def ensure_signing_configs(text):
              loc = locate_keyword_block(text, 'signingConfigs')
              if loc:
                  s_start, s_open, s_close = loc
                  signing_block = text[s_open+1:s_close]
                  rel_match = re.search(r'release\s*\{', signing_block)
                  if rel_match:
                      rel_open_in_block = signing_block.find('{', rel_match.end()-1)
                      rel_open_idx = s_open + 1 + rel_open_in_block
                      rel_close_idx = find_block(text, rel_open_idx)
                      if rel_close_idx == -1:
                          return None, False, 'Malformed release block in signingConfigs (unbalanced braces)'
                      release_inner = text[rel_open_idx+1:rel_close_idx]
                      if (re.search(r'storeFile\s*file\(["\']{}["\']\)'.format(re.escape(KEYS['keystore'])), release_inner)
                          and re.search(r'keyAlias\s*["\']{}["\']'.format(re.escape(KEYS['alias'])), release_inner)):
                          return text, False, 'Existing signingConfigs.release correct'
                      new_release = (
                          'release {\n'
                          '            storeFile file("%s")\n'
                          '            storePassword "%s"\n'
                          '            keyAlias "%s"\n'
                          '            keyPassword "%s"\n'
                          '        }') % (KEYS['keystore'], KEYS['password'], KEYS['alias'], KEYS['password'])
                      sb_before = text[s_open+1:rel_open_idx]
                      sb_after = text[rel_close_idx+1:s_close]
                      new_signing = sb_before + new_release + sb_after
                      new_text = text[:s_open+1] + new_signing + text[s_close:]
                      return new_text, True, 'Updated existing signingConfigs.release'
                  insert = (
                      '\n        release {\n'
                      '            storeFile file("%s")\n'
                      '            storePassword "%s"\n'
                      '            keyAlias "%s"\n'
                      '            keyPassword "%s"\n'
                      '        }\n') % (KEYS['keystore'], KEYS['password'], KEYS['alias'], KEYS['password'])
                  new_text = text[:s_close] + insert + text[s_close:]
                  return new_text, True, 'Inserted release block into signingConfigs'

              bt_loc = text.find('    buildTypes {')
              if bt_loc != -1:
                  insert = (
                      '    signingConfigs {\n'
                      '        release {\n'
                      '            storeFile file("%s")\n'
                      '            storePassword "%s"\n'
                      '            keyAlias "%s"\n'
                      '            keyPassword "%s"\n'
                      '        }\n'
                      '    }\n\n') % (KEYS['keystore'], KEYS['password'], KEYS['alias'], KEYS['password'])
                  new_text = text.replace('    buildTypes {', insert + '    buildTypes {', 1)
                  return new_text, True, 'Inserted signingConfigs before buildTypes'

              return None, False, "Could not find 'buildTypes {' marker to insert signingConfigs"

          def ensure_release_buildtype(text):
              bt_loc = locate_keyword_block(text, 'buildTypes')
              if not bt_loc:
                  return None, False, "Could not locate buildTypes block"
              _, bt_open, bt_close = bt_loc
              bt_text = text[bt_open+1:bt_close]
              m = re.search(r'release\s*\{', bt_text)
              if not m:
                  return None, False, 'No release buildType found'
              rel_open_in_bt = bt_text.find('{', m.end()-1)
              rel_open_idx = bt_open + 1 + rel_open_in_bt
              rel_close_idx = find_block(text, rel_open_idx)
              if rel_close_idx == -1:
                  return None, False, 'Malformed release block (unbalanced braces)'
              release_inner = text[rel_open_idx+1:rel_close_idx]
              if 'signingConfig signingConfigs.release' in release_inner:
                  return text, False, 'release buildType already uses signingConfigs.release'
              if 'signingConfig signingConfigs.debug' in release_inner:
                  new_inner = release_inner.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              else:
                  new_inner = '\n            signingConfig signingConfigs.release\n' + release_inner
              new_text = text[:rel_open_idx+1] + new_inner + text[rel_close_idx:]
              return new_text, True, 'Updated release buildType to use signingConfigs.release'

          for i in range(2):
              text = GRADLE_PATH.read_text()
              new_text, changed, msg = ensure_signing_configs(text)
              if new_text is None:
                  print('ERROR:', msg)
                  raise SystemExit(1)
              if changed:
                  GRADLE_PATH.write_text(new_text)
                  print('INFO:', msg)
              else:
                  print('INFO:', msg)

              text = GRADLE_PATH.read_text()
              final_text, changed2, msg2 = ensure_release_buildtype(text)
              if final_text is None:
                  print('ERROR:', msg2)
                  raise SystemExit(1)
              if changed2:
                  GRADLE_PATH.write_text(final_text)
                  print('INFO:', msg2)
              else:
                  print('INFO:', msg2)

          print('Patch completed successfully (idempotent verification done).')
          raise SystemExit(0)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swish-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated keystore
        uses: actions/upload-artifact@v4
        with:
          name: swish-keystore
          path: android/app/swish-release.keystore
          if-no-files-found: error
