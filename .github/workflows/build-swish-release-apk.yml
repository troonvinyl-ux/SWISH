name: Build signed SWISH APK (CI-generated keystore)

on:
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME"
          cd /tmp
          curl -fLo commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/swish-release.keystore \
            -alias swish \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "swish123" \
            -keypass "swish123" \
            -dname "CN=SWISH, OU=Mobile, O=SWISH, L=London, S=London, C=GB"

      - name: Patch Android app build.gradle for release signing only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()

          if 'signingConfigs' in text:
              raise SystemExit('signingConfigs already present; aborting to avoid duplicate config')

          marker = "    buildTypes {\n"
          insert = """    signingConfigs {\n        release {\n            storeFile file(\"swish-release.keystore\")\n            storePassword \"swish123\"\n            keyAlias \"swish\"\n            keyPassword \"swish123\"\n        }\n    }\n\n"""

          idx = text.index(marker)
          text = text[:idx] + insert + text[idx:]

          text = text.replace(
              "        release {\n            signingConfig signingConfigs.debug\n            minifyEnabled enableProguardInReleaseBuilds\n            proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\"\n        }",
              "        release {\n            signingConfig signingConfigs.release\n            minifyEnabled enableProguardInReleaseBuilds\n            proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\"\n        }"
          )

          text = text.replace(
              "        debug {\n            debuggable true\n            signingConfig signingConfigs.debug\n        }",
              "        debug {\n            debuggable true\n            signingConfig signingConfigs.debug\n        }"
          )

          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace(
                  "        release {\n            signingConfig signingConfigs.debug\n",
                  "        release {\n            signingConfig signingConfigs.release\n"
              )

          p.write_text(text)
          PY

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: swish-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload generated keystore
        uses: actions/upload-artifact@v4
        with:
          name: swish-keystore
          path: android/app/swish-release.keystore
          if-no-files-found: error
