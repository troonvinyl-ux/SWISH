name: Build SWISH unified signed testing APK
on:
  push:
    branches: [main]
    paths:
      - app.json
      - app.config.js
      - eas.json
      - package.json
      - pnpm-lock.yaml
      - 'plugins/**'
      - release/android-installed-baseline.json
      - .github/workflows/build-swish-unified.yml
      - .github/workflows/build-swish-release-apk.yml
      - scripts/verify-unified-apk.sh
  workflow_dispatch:
    inputs:
      quick_test_apk:
        type: boolean
        required: false
        default: false
        description: Build preview Android APK without unrelated full regression suite
      production_acceptance_run:
        type: string
        required: false
        description: Protected successful current-source acceptance run (production only)
      channel:
        type: choice
        required: true
        default: preview-unified
        options: [preview-unified, production-unified]
concurrency:
  group: swish-unified-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  unified:
    uses: ./.github/workflows/build-swish-unified.yml
    with:
      quick_test_apk: ${{ github.event_name == 'push' || inputs.quick_test_apk == true }}
      production_acceptance_run: ${{ inputs.production_acceptance_run || '' }}
      channel: ${{ inputs.channel || 'preview-unified' }}
      build_android: true
      build_ios: false
    secrets: inherit
# Uses only the existing approved certificate; no separate Master Admin binary or store release.
