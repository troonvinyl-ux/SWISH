name: Reusable isolated Android APK build
on:
  workflow_call:
    inputs:
      niche:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SWISH_NICHE: ${{ inputs.niche }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible dependency installation
        run: bash scripts/install-dependencies.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests (mandatory release gate)
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand
      - name: Prepare and validate isolated route tree
        run: |
          node scripts/prepare-niche-routes.js
          node scripts/verify-niche-module.js
          npx expo config --type public --json > /tmp/swish-expo-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json', 'utf8'));
          const product = require('./niche-modules.json').products[process.env.SWISH_NICHE];
          const router = config.plugins.find(p => Array.isArray(p) && p[0] === 'expo-router');
          if (config.extra.swishNicheId !== product.id || config.android.package !== product.androidPackage) throw new Error('Build identity mismatch');
          if (router?.[1]?.root !== `.swish-build/${product.id}/app`) throw new Error('Router isolation root mismatch');
          NODE
      - name: Install Android 16 SDK platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Verify Android 16 SDK configuration
        run: node scripts/verify-android-sdk-config.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'pnpm-lock.yaml', 'package-lock.json', 'app.config.js') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
      - name: Inspect real APK before upload
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-apk.sh "$APK" "$SWISH_NICHE"
          mkdir -p dist
          cp "$APK" "dist/${SWISH_NICHE}.apk"
          sha256sum "dist/${SWISH_NICHE}.apk" > "dist/${SWISH_NICHE}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: swish-${{ inputs.niche }}-apk
          path: |
            dist/${{ inputs.niche }}.apk
            dist/${{ inputs.niche }}.sha256
          if-no-files-found: error
          retention-days: 14
