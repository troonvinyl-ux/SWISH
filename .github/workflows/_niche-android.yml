name: Reusable isolated Android APK build
on:
  workflow_call:
    inputs:
      niche:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SWISH_NICHE: ${{ inputs.niche }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      SWISH_RELEASE_KEYSTORE_BASE64: ${{ secrets.SWISH_RELEASE_KEYSTORE_BASE64 }}
      SWISH_KEYSTORE_STORE_PASSWORD: ${{ secrets.SWISH_KEYSTORE_STORE_PASSWORD }}
      SWISH_KEYSTORE_KEY_PASSWORD: ${{ secrets.SWISH_KEYSTORE_KEY_PASSWORD }}
      SWISH_KEYSTORE_KEY_ALIAS: ${{ secrets.SWISH_KEYSTORE_KEY_ALIAS }}
      SWISH_RELEASE_CERT_SHA256: ${{ vars.SWISH_RELEASE_CERT_SHA256 || secrets.SWISH_RELEASE_CERT_SHA256 }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible dependency installation
        run: bash scripts/install-dependencies.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests (mandatory release gate)
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand
      - name: Load public Supabase configuration from repository .env when needed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '.env';
          if (!fs.existsSync(path)) {
            console.log('No repository .env found; using configured GitHub variables/secrets.');
            process.exit(0);
          }
          const values = {};
          for (const raw of fs.readFileSync(path, 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const match = line.match(/^(EXPO_PUBLIC_SUPABASE_URL|EXPO_PUBLIC_SUPABASE_ANON_KEY)\s*=\s*(.*)$/);
            if (!match) continue;
            let value = match[2].trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            values[match[1]] = value;
          }
          const out = [];
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) {
            if (!process.env[key] && values[key]) out.push(`${key}=${values[key]}`);
          }
          if (out.length) fs.appendFileSync(process.env.GITHUB_ENV, out.join('\n') + '\n', { mode: 0o600 });
          console.log(`Loaded ${out.length} missing public Supabase setting(s) from .env; values withheld.`);
          NODE
      - name: Verify public Supabase configuration is available
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}" || { echo "::error::EXPO_PUBLIC_SUPABASE_URL is missing from GitHub Actions repository variables or secrets."; exit 1; }
          test -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" || { echo "::error::EXPO_PUBLIC_SUPABASE_ANON_KEY is missing from GitHub Actions repository variables or secrets."; exit 1; }
          node -e "const u=new URL(process.env.EXPO_PUBLIC_SUPABASE_URL); if (!['https:','http:'].includes(u.protocol)) process.exit(1)"
      - name: Prepare and validate isolated route tree
        run: |
          node scripts/prepare-niche-routes.js
          node scripts/prepare-niche-assets.mjs
          node scripts/verify-niche-module.js
          npx expo config --type public --json > /tmp/swish-expo-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json', 'utf8'));
          const product = require('./niche-modules.json').products[process.env.SWISH_NICHE];
          const router = config.plugins.find(p => Array.isArray(p) && p[0] === 'expo-router');
          if (config.extra.swishNicheId !== product.id || config.android.package !== product.androidPackage) throw new Error('Build identity mismatch');
          if (router?.[1]?.root !== `.swish-build/${product.id}/app`) throw new Error('Router isolation root mismatch');
          if (config.extra?.supabase?.url !== process.env.EXPO_PUBLIC_SUPABASE_URL) throw new Error('Supabase URL was not embedded in Expo runtime config');
          if (config.extra?.supabase?.anonKey !== process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY) throw new Error('Supabase anon key was not embedded in Expo runtime config');
          if (!config.updates?.url?.includes(process.env.EXPO_PROJECT_ID)) throw new Error('EAS update URL was not embedded');
          if (!config.runtimeVersion) throw new Error('Runtime version is missing; OTA compatibility cannot be established');
          if (config.updates?.requestHeaders?.['expo-channel-name'] !== `production-${process.env.SWISH_NICHE}`) throw new Error('Niche OTA channel does not match the installed app');
          NODE
      - name: Install Android 16 SDK platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Verify Android 16 SDK configuration
        run: node scripts/verify-android-sdk-config.mjs
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'pnpm-lock.yaml', 'package-lock.json', 'app.config.js') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Configure existing persistent production signing
        run: node scripts/configure-niche-signing.mjs
      - name: Compile APK and retain compiler evidence
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../dist
          ./gradlew assembleRelease --no-daemon --max-workers=1 --console=plain -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dkotlin.compiler.execution.strategy=in-process 2>&1 | tee ../dist/android-build.log
      - name: Inspect real APK before upload
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-apk.sh "$APK" "$SWISH_NICHE"
          mkdir -p dist
          cp "$APK" "dist/${SWISH_NICHE}.apk"
          sha256sum "dist/${SWISH_NICHE}.apk" > "dist/${SWISH_NICHE}.sha256"
          cp /tmp/swish-expo-config.json "dist/${SWISH_NICHE}-runtime-config.json"
          cp ".swish-build/${SWISH_NICHE}/import-closure.json" "dist/${SWISH_NICHE}-import-closure.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "::error::Build checkout does not match the pinned workflow SHA."; exit 1; }
          node scripts/create-niche-apk-metadata.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: swish-${{ inputs.niche }}-apk
          path: |
            dist/${{ inputs.niche }}.apk
            dist/${{ inputs.niche }}.sha256
            dist/${{ inputs.niche }}-runtime-config.json
            dist/${{ inputs.niche }}-import-closure.json
            dist/${{ inputs.niche }}-metadata.json
            dist/${{ inputs.niche }}-signing.txt
          if-no-files-found: error
          retention-days: 90
      - name: Retain build failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swish-${{ inputs.niche }}-build-evidence
          path: |
            dist/android-build.log
            .swish-build/${{ inputs.niche }}/import-closure.json
          if-no-files-found: warn
          retention-days: 90
