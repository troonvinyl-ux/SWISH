name: SWISH branded web production builds

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'contexts/**'
      - 'services/**'
      - 'hooks/**'
      - 'assets/**'
      - 'niche-modules.json'
      - 'scripts/prepare-niche-assets.mjs'
      - 'scripts/prepare-niche-routes.js'
      - 'scripts/**'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/branded-web-builds.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/**'
      - 'contexts/**'
      - 'services/**'
      - 'hooks/**'
      - 'assets/**'
      - 'niche-modules.json'
      - 'scripts/**'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/branded-web-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swish-branded-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-web:
    name: Export web — ${{ matrix.niche }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        niche:
          - coins
          - motocross
          - bicycles
          - clothing
          - surplus_flip
          - antiques
          - fossils
          - trading_cards
          - beauty
          - tech
          - collectibles

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Install dependencies
        run: bash scripts/install-dependencies.sh

      - name: Typecheck and regression gate
        run: |
          npx tsc --noEmit
          npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand

      - name: Prepare niche-only brand artwork
        env:
          SWISH_NICHE: ${{ matrix.niche }}
        run: node scripts/prepare-niche-assets.mjs

      - name: Validate branded app identity
        env:
          SWISH_NICHE: ${{ matrix.niche }}
        run: |
          pnpm exec expo config --type public --json > /tmp/swish-web-expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const registry = require('./niche-modules.json');
          const niche = process.env.SWISH_NICHE;
          const product = registry.products[niche];
          const config = JSON.parse(fs.readFileSync('/tmp/swish-web-expo-config.json', 'utf8'));
          const splash = (config.plugins || []).find(p => Array.isArray(p) && p[0] === 'expo-splash-screen');
          const runtime = (config.version || '1.0.0') + '-' + niche + '-isolated-api36-v1';
          if (!product || config.name !== product.name || config.android?.package !== product.androidPackage || config.ios?.bundleIdentifier !== product.iosBundleIdentifier || config.scheme !== product.scheme) throw new Error('Canonical app identity mismatch: ' + niche);
          if (config.extra?.swishNicheId !== niche || !config.icon || config.android?.adaptiveIcon?.foregroundImage !== config.icon || splash?.[1]?.image !== config.icon) throw new Error('Niche branding/icon/splash mismatch: ' + niche);
          if (config.runtimeVersion !== runtime || config.updates?.requestHeaders?.['expo-channel-name'] !== 'production-' + niche) throw new Error('Niche OTA runtime/channel mismatch: ' + niche);
          NODE

      - name: Export static web application
        env:
          SWISH_NICHE: ${{ matrix.niche }}
          SWISH_WEB_BASE_URL: /niche-apps/${{ matrix.niche }}
        run: pnpm exec expo export --platform web --output-dir dist/web

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: swish-web-${{ matrix.niche }}
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
