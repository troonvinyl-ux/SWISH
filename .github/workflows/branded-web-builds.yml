name: SWISH unified shared web artifact
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  shared-web:
    uses: ./.github/workflows/build-swish-unified.yml
    with:
      build_android: false
      build_ios: false
    secrets: inherit
# One shared Expo browser artifact; no separate niche websites or deployment.
