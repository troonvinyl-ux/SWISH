name: Build SWISH Android APK

on:
  workflow_dispatch:
    inputs:
      niche:
        description: Which branded SWISH app to build
        required: true
        type: choice
        default: surplus_flip
        options:
          - surplus_flip
          - coins
          - motocross
          - bicycles
          - clothing

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ inputs.niche }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project for selected niche
        env:
          SWISH_NICHE: ${{ inputs.niche }}
        run: pnpm exec expo prebuild --platform android --clean

      # Cache Gradle dependencies and compiled transforms between runs. Expo prebuild
      # must run first because it generates the Android Gradle files used in the cache key.
      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --console=plain --info

      - name: Name APK
        env:
          NICHE: ${{ inputs.niche }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/${NICHE}.apk"
          sha256sum "dist/${NICHE}.apk" > "dist/${NICHE}.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: swish-${{ inputs.niche }}-apk
          path: |
            dist/${{ inputs.niche }}.apk
            dist/${{ inputs.niche }}.sha256
          if-no-files-found: error
          retention-days: 14
