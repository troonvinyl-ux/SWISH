name: SWISH unified routing and module checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SWISH_NICHE: ''
      SWISH_MASTER_ADMIN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/install-dependencies.sh
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: node scripts/validate-unified-modules.mjs
      - run: node scripts/sync-backend-registry.mjs --check
      - run: node scripts/validate-edge-deployment.mjs
      - name: Full regression suite; no legacy failures are suppressed
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand --json --outputFile=swish-regression-results.json
      - name: Preserve executed regression evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swish-unified-regression-evidence
          path: swish-regression-results.json
          if-no-files-found: warn
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-read --allow-env supabase/tests/paidNicheAuthorization.test.ts
      - name: Shared mobile JavaScript export (not native binary acceptance)
        run: npx expo export --platform android --output-dir dist-ci-unified
