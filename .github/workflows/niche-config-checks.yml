name: SWISH niche routing and branded config

concurrency:
  group: swish-niche-checks-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'app.config.js'
      - 'app.json'
      # Secret-boundary checks cover every client source change, not just niche routes.
      - 'app/**'
      - 'services/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'components/**'
      - 'constants/**'
      - 'template/**'
      - 'plugins/**'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'jest.config.ci.js'
      - 'tsconfig.json'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/migrations/**'
      - 'shared/**'
      - 'niche-modules.json'
      - 'services/nicheRouting.ts'
      - 'constants/niches.ts'
      - 'constants/specialists.ts'
      - 'services/__tests__/nicheIsolation.test.ts'
      - 'services/__tests__/entryRoutes.test.ts'
      - 'services/__tests__/brandedBuildConfig.test.ts'
      - 'services/__tests__/surplusFlipRouting.test.ts'
      - 'app/master-admin.tsx'
      - 'app/entry/surplus-flip.tsx'
      - 'app/surplus-flip.tsx'
      - 'app/(tabs)/inventory.tsx'
      - 'contexts/AppContext.tsx'
      - 'app/index.tsx'
      - 'app/(tabs)/index.tsx'
      - 'app/(tabs)/_layout.tsx'
      - 'app/niche-select.tsx'
      - 'app/onboarding.tsx'
      - 'supabase/functions/swish-create-checkout/index.ts'
      - 'supabase/functions/swish-ebay-list/index.ts'
      - 'supabase/functions/swish-ebay-sync/index.ts'
      - 'supabase/functions/swish-ebay-orders/index.ts'
      - 'supabase/functions/swish-ebay-post-order/index.ts'
      - 'supabase/functions/swish-ebay-finances/index.ts'
      - 'supabase/functions/_shared/credentialCrypto.ts'
      - 'supabase/functions/_shared/ebayDigitalSignature.ts'
      - 'supabase/functions/swish-migrate-credentials/index.ts'
      - 'app/ebay-finances.tsx'
      - 'app/ebay-hub.tsx'
      - 'services/orderService.ts'
      - 'services/coinInventoryService.ts'
      - 'services/listingService.ts'
      - 'app/orders.tsx'
      - 'app/dispatch.tsx'
      - 'app/coin-flipper.tsx'
      - 'services/aiIdentificationService.ts'
      - 'services/islamicIdentificationService.ts'
      - '.github/workflows/niche-config-checks.yml'
  pull_request:
    paths:
      - 'app.config.js'
      - 'app.json'
      # Secret-boundary checks cover every client source change, not just niche routes.
      - 'app/**'
      - 'services/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'components/**'
      - 'constants/**'
      - 'template/**'
      - 'plugins/**'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'jest.config.ci.js'
      - 'tsconfig.json'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/migrations/**'
      - 'shared/**'
      - 'niche-modules.json'
      - 'services/nicheRouting.ts'
      - 'constants/niches.ts'
      - 'constants/specialists.ts'
      - 'services/__tests__/nicheIsolation.test.ts'
      - 'services/__tests__/entryRoutes.test.ts'
      - 'services/__tests__/brandedBuildConfig.test.ts'
      - 'services/__tests__/surplusFlipRouting.test.ts'
      - 'app/master-admin.tsx'
      - 'app/entry/surplus-flip.tsx'
      - 'app/surplus-flip.tsx'
      - 'app/(tabs)/inventory.tsx'
      - 'contexts/AppContext.tsx'
      - 'app/index.tsx'
      - 'app/(tabs)/index.tsx'
      - 'app/niche-select.tsx'
      - 'app/onboarding.tsx'
      - 'supabase/functions/swish-create-checkout/index.ts'
      - 'supabase/functions/swish-ebay-list/index.ts'
      - 'supabase/functions/swish-ebay-sync/index.ts'
      - 'supabase/functions/swish-ebay-orders/index.ts'
      - 'supabase/functions/swish-ebay-post-order/index.ts'
      - 'supabase/functions/swish-ebay-finances/index.ts'
      - 'supabase/functions/_shared/credentialCrypto.ts'
      - 'supabase/functions/_shared/ebayDigitalSignature.ts'
      - 'supabase/functions/swish-migrate-credentials/index.ts'
      - 'app/ebay-finances.tsx'
      - 'app/ebay-hub.tsx'
      - 'services/orderService.ts'
      - 'app/coin-flipper.tsx'
      - 'services/aiIdentificationService.ts'
      - 'services/islamicIdentificationService.ts'
      - '.github/workflows/niche-config-checks.yml'

jobs:
  niche-routing:
    # The owner-dashboard PR has its own isolated validation job below. Keep this
    # full-repository gate for ordinary SWISH routing changes; the current main
    # tree has unrelated legacy lint/type errors that are outside this app root.
    if: github.event_name != 'pull_request' || !contains(github.head_ref, 'master-dashboard-apk')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: bash scripts/install-dependencies.sh

      - name: Run project lint
        run: pnpm lint

      - name: Report project-wide TypeScript diagnostics and gate core coin files
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/swish-tsc.log 2>&1
          tsc_status=$?
          set -e
          cat /tmp/swish-tsc.log
          if grep -E 'app/coin-flipper.tsx|services/aiIdentificationService.ts|services/islamicIdentificationService.ts' /tmp/swish-tsc.log; then
            echo "TypeScript diagnostics found in the coin scanner or its AI services."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "Project-wide TypeScript diagnostics remain. Fix all errors before this check can pass."
            exit 1
          fi
          echo "Project-wide TypeScript check passed with zero diagnostics."

      - name: Check Supabase Edge Function TypeScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const ts = require('typescript');
          const root = 'supabase/functions';
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.ts')) files.push(full);
            }
          }
          walk(root);
          const failures = [];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext },
            });
            for (const diagnostic of result.diagnostics ?? []) {
              if (diagnostic.category !== ts.DiagnosticCategory.Error) continue;
              const location = diagnostic.file && diagnostic.start !== undefined
                ? diagnostic.file.getLineAndCharacterOfPosition(diagnostic.start)
                : null;
              failures.push(`${file}${location ? `:${location.line + 1}:${location.character + 1}` : ''}: ${ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n')}`);
            }
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log(`Syntax check passed for ${files.length} Edge Function TypeScript files.`);
          NODE

      - name: Run complete regression suite including engineering hardening
        run: pnpm dlx jest@29.7.0 --config jest.config.ci.js --runInBand

      - name: Setup Deno for server authorization tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test shared server authorization boundaries
        run: deno test --allow-read --allow-env supabase/tests/paidNicheAuthorization.test.ts

      - name: Bundle Android production JavaScript
        run: npx expo export --platform android --output-dir dist-ci-android && rm -rf dist-ci-android

      - name: Validate all ten Expo branded configurations
        shell: bash
        run: |
          set -euo pipefail
          for niche in coins motocross bicycles clothing trading_cards antiques fossils beauty tech surplus_flip; do
            echo "Validating branded config: $niche"
            SWISH_NICHE="$niche" npx expo config --type public >/dev/null
          done
  master-dashboard-validation:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'master-dashboard-apk')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: bash scripts/install-dependencies.sh

      - name: Lint isolated dashboard routes
        run: pnpm exec eslint app/master-dashboard/index.tsx app/master-dashboard/_layout.tsx app/master-dashboard/login.tsx

      - name: TypeScript validation for dashboard dependency graph
        run: npx tsc --noEmit --project tsconfig.master-dashboard.json

      - name: Verify existing niche config regression
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand services/__tests__/brandedBuildConfig.test.ts

      - name: Verify all ten niche configurations remain selectable
        shell: bash
        run: |
          set -euo pipefail
          for niche in coins motocross bicycles clothing trading_cards antiques fossils beauty tech surplus_flip; do
            echo "Validating existing niche config: $niche"
            SWISH_NICHE="$niche" npx expo config --type public >/dev/null
          done

