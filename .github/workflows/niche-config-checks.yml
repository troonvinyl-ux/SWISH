name: SWISH niche routing and branded config

on:
  push:
    branches: [main]
    paths:
      - 'app.config.js'
      - 'eas.json'
      - 'services/nicheRouting.ts'
      - 'constants/niches.ts'
      - 'constants/specialists.ts'
      - 'services/__tests__/nicheIsolation.test.ts'
      - 'services/__tests__/entryRoutes.test.ts'
      - 'services/__tests__/brandedBuildConfig.test.ts'
      - 'services/__tests__/surplusFlipRouting.test.ts'
      - 'app/master-admin.tsx'
      - 'services/__tests__/surplusFlipRouting.test.ts'
      - 'app/master-admin.tsx'
      - 'app/entry/surplus-flip.tsx'
      - 'app/surplus-flip.tsx'
      - 'app/(tabs)/inventory.tsx'
      - 'contexts/AppContext.tsx'
      - 'app/index.tsx'
      - 'app/(tabs)/index.tsx'
      - 'app/niche-select.tsx'
      - 'app/onboarding.tsx'
      - 'supabase/functions/swish-create-checkout/index.ts'
      - 'supabase/functions/swish-ebay-list/index.ts'
      - 'supabase/functions/swish-ebay-sync/index.ts'
      - 'supabase/functions/swish-ebay-orders/index.ts'
      - 'supabase/functions/swish-ebay-post-order/index.ts'
      - 'supabase/functions/swish-ebay-finances/index.ts'
      - 'services/orderService.ts'
      - 'app/coin-flipper.tsx'
      - 'services/aiIdentificationService.ts'
      - 'services/islamicIdentificationService.ts'
      - '.github/workflows/niche-config-checks.yml'
  pull_request:
    paths:
      - 'app.config.js'
      - 'eas.json'
      - 'services/nicheRouting.ts'
      - 'constants/niches.ts'
      - 'constants/specialists.ts'
      - 'services/__tests__/nicheIsolation.test.ts'
      - 'services/__tests__/entryRoutes.test.ts'
      - 'services/__tests__/brandedBuildConfig.test.ts'
      - 'services/__tests__/surplusFlipRouting.test.ts'
      - 'app/master-admin.tsx'
      - 'app/entry/surplus-flip.tsx'
      - 'app/surplus-flip.tsx'
      - 'app/(tabs)/inventory.tsx'
      - 'contexts/AppContext.tsx'
      - 'app/index.tsx'
      - 'app/(tabs)/index.tsx'
      - 'app/niche-select.tsx'
      - 'app/onboarding.tsx'
      - 'supabase/functions/swish-create-checkout/index.ts'
      - 'supabase/functions/swish-ebay-list/index.ts'
      - 'supabase/functions/swish-ebay-sync/index.ts'
      - 'supabase/functions/swish-ebay-orders/index.ts'
      - 'supabase/functions/swish-ebay-post-order/index.ts'
      - 'supabase/functions/swish-ebay-finances/index.ts'
      - 'services/orderService.ts'
      - 'app/coin-flipper.tsx'
      - 'services/aiIdentificationService.ts'
      - 'services/islamicIdentificationService.ts'
      - '.github/workflows/niche-config-checks.yml'

jobs:
  niche-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check coin scanner and AI service TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/swish-tsc.log 2>&1
          set -e
          if grep -E 'app/coin-flipper.tsx|services/aiIdentificationService.ts|services/islamicIdentificationService.ts' /tmp/swish-tsc.log; then
            echo "TypeScript diagnostics found in the coin scanner or its AI services."
            exit 1
          fi
          echo "No TypeScript diagnostics in the coin scanner or AI services."
          echo "The existing project-wide check also reports unrelated errors in other files; those are not used as a gate here."

      - name: Install Jest runner for pure service regression tests
        run: pnpm add -D jest@29.7.0

      - name: Run routing and build-identity regression tests
        run: npx jest --config jest.config.ci.js --runInBand services/__tests__/entryRoutes.test.ts services/__tests__/nicheIsolation.test.ts services/__tests__/brandedBuildConfig.test.ts services/__tests__/surplusFlipRouting.test.ts

      - name: Validate all five Expo branded configurations
        shell: bash
        run: |
          set -euo pipefail
          for niche in coins motocross bicycles clothing surplus_flip; do
            echo "Validating branded config: $niche"
            SWISH_NICHE="$niche" npx expo config --type public >/dev/null
          done
