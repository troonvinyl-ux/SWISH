name: Numista image search contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shared/numistaImageSearch.ts'
      - 'services/numistaImagePreparationService.ts'
      - 'services/aiIdentificationService.ts'
      - 'services/captureDraftService.ts'
      - 'supabase/functions/_shared/numistaImageSearch*.ts'
      - 'supabase/functions/swish-identify/index.ts'
      - 'services/__tests__/numista*.test.ts'
      - 'supabase/tests/numista_image_search.test.ts'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Mocked client and policy regressions
        run: npx jest --config jest.config.ci.js --runInBand services/__tests__/numistaImageSearch.test.ts services/__tests__/numistaImagePreparation.test.ts services/__tests__/numistaSearchBudget.test.ts services/__tests__/identificationReliability.test.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Mock-only server gateway checks
        run: deno test --allow-env supabase/tests/numista_image_search.test.ts
