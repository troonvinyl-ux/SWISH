name: Build SWISH Complete APK Suite
on:
  push:
    branches:
      - 'release/apk-suite-*'
  workflow_dispatch:
    inputs:
      include_master_admin:
        description: Build the full Master Switch admin and shopfront APK
        required: true
        type: boolean
        default: true
      include_all_niches:
        description: Build all ten isolated niche APKs
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  niche-apks:
    if: ${{ github.event_name == 'push' || inputs.include_all_niches }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        niche: [coins, motocross, bicycles, clothing, surplus_flip, trading_cards, antiques, fossils, beauty, tech]
    uses: ./.github/workflows/_niche-android.yml
    with:
      niche: ${{ matrix.niche }}
  master-admin-apk:
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    if: ${{ github.event_name == 'push' || inputs.include_master_admin }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible dependency installation
        run: bash scripts/install-dependencies.sh
      - name: Load public Supabase configuration from repository .env when needed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('.env')) process.exit(0);
          const values = {};
          for (const raw of fs.readFileSync('.env', 'utf8').split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const match = line.match(/^(EXPO_PUBLIC_SUPABASE_URL|EXPO_PUBLIC_SUPABASE_ANON_KEY)\s*=\s*(.*)$/);
            if (!match) continue;
            let value = match[2].trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
            values[match[1]] = value;
          }
          const out = [];
          for (const key of ['EXPO_PUBLIC_SUPABASE_URL', 'EXPO_PUBLIC_SUPABASE_ANON_KEY']) if (!process.env[key] && values[key]) out.push(`${key}=${values[key]}`);
          if (out.length) fs.appendFileSync(process.env.GITHUB_ENV, out.join('\n') + '\n', { mode: 0o600 });
          console.log(`Loaded ${out.length} public Supabase setting(s) for Master Admin; values withheld.`);
          NODE
      - name: Verify public Supabase config before Master Admin prebuild
        env:
          SWISH_MASTER_ADMIN: '1'
        run: |
          set -euo pipefail
          test -n "${EXPO_PUBLIC_SUPABASE_URL:-}"
          test -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"
          npx expo config --type public --json > /tmp/swish-master-config.json
          test -n "${EXPO_PROJECT_ID:-}" || { echo "::error::Missing EXPO_PROJECT_ID; refusing to build an APK without OTA configuration."; exit 1; }
          npx expo config --type public --json > /tmp/swish-master-config.json
          node - <<'NODE'
          const c = JSON.parse(require('node:fs').readFileSync('/tmp/swish-master-config.json', 'utf8'));
          if (c.extra?.supabase?.url !== process.env.EXPO_PUBLIC_SUPABASE_URL) throw new Error('Master Admin Supabase URL not embedded');
          if (c.extra?.supabase?.anonKey !== process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY) throw new Error('Master Admin Supabase anon key not embedded');
          NODE
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests (mandatory release gate)
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand
      - name: Install Android 16 SDK platform and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"
      - name: Confirm lightweight Master Admin route tree is present
        run: |
          test -f app/master-admin.tsx
          test -f master-admin-app/_layout.tsx
          test -f master-admin-app/index.tsx
          test -f master-admin-app/login.tsx
          test -f master-admin-app/master-admin.tsx
          test -f app.config.js
      - name: Generate dedicated Master Admin Android project
        env:
          SWISH_NICHE: ''
          SWISH_MASTER_ADMIN: '1'
          EXPO_NO_DOTENV: '1'
        run: npx expo prebuild --platform android --clean
      - name: Verify Android 16 SDK configuration
        run: node scripts/verify-android-sdk-config.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-master-${{ hashFiles('android/**/*.gradle*', 'pnpm-lock.yaml', 'app.config.js') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile lightweight Master Admin launcher APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
      - name: Verify Master Admin APK identity and signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          bash scripts/verify-master-admin-apk.sh "$APK"
          mkdir -p dist
          cp "$APK" dist/swish-master-admin.apk
          sha256sum dist/swish-master-admin.apk > dist/swish-master-admin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: swish-master-admin-launcher-apk
          path: |
            dist/swish-master-admin.apk
            dist/swish-master-admin.sha256
          if-no-files-found: error
          retention-days: 14
