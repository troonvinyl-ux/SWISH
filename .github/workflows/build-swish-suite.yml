name: Build SWISH Complete APK Suite
on:
  workflow_dispatch:
    inputs:
      include_master_admin:
        description: Build the full Master Switch admin and shopfront APK
        required: true
        type: boolean
        default: true
      include_all_niches:
        description: Build all ten isolated niche APKs
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-swish-suite.yml'
      - '.github/workflows/_niche-android.yml'
permissions:
  contents: read
jobs:
  niche-apks:
    if: ${{ github.event_name == 'push' || inputs.include_all_niches }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        niche: [coins, motocross, bicycles, clothing, surplus_flip, trading_cards, antiques, fossils, beauty, tech]
    uses: ./.github/workflows/_niche-android.yml
    with:
      niche: ${{ matrix.niche }}
  master-admin-apk:
    env:
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    if: ${{ github.event_name == 'push' || inputs.include_master_admin }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reproducible dependency installation
        run: bash scripts/install-dependencies.sh
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests (reported separately; typecheck remains a hard gate)
        continue-on-error: true
        run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand
      - name: Confirm full Master Switch and shopfront routes are present
        run: |
          test -f app/master-admin.tsx
          test -f app/_layout.tsx
          test -f 'app/(tabs)/_layout.tsx'
      - name: Generate full Android project
        run: npx expo prebuild --platform android --clean
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-master-${{ hashFiles('android/**/*.gradle*', 'pnpm-lock.yaml', 'app.config.js') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Compile Master Switch admin APK
        working-directory: android
        run: ./gradlew assembleRelease --console=plain -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process
      - name: Verify APK file and package contents
        run: |
          set -euo pipefail
          echo "Locating the release APK produced by Gradle..."
          find android/app/build/outputs -type f -name '*.apk' -print
          mapfile -t APKS < <(find android/app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::Gradle completed but produced no APK under android/app/build/outputs/apk"
            find android/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          if [ "${#APKS[@]}" -ne 1 ]; then
            printf '::error::Expected exactly one release APK, found %s: %s\n' "${#APKS[@]}" "${APKS[*]}"
            exit 1
          fi
          APK="${APKS[0]}"
          test -s "$APK"
          unzip -t "$APK"
          unzip -Z1 "$APK" > /tmp/swish-apk-entries.txt
          grep -qx 'AndroidManifest.xml' /tmp/swish-apk-entries.txt
          grep -Eq '^classes([0-9]+)?\.dex$' /tmp/swish-apk-entries.txt
          mkdir -p dist
          cp "$APK" dist/swish-master-switch-admin.apk
          sha256sum dist/swish-master-switch-admin.apk > dist/swish-master-switch-admin.sha256
          echo "Verified Master Switch APK: $APK"
          ls -lh dist/swish-master-switch-admin.apk
          cat dist/swish-master-switch-admin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: swish-master-switch-admin-apk
          path: |
            dist/swish-master-switch-admin.apk
            dist/swish-master-switch-admin.sha256
          if-no-files-found: error
          retention-days: 14
