name: Build isolated SWISH Test Lab APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.config.js'
      - 'test-lab-app/**'
      - '.github/workflows/test-lab-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'niche-modules.json'
      - 'services/**'
      - 'constants/niches.ts'
  push:
    branches: [feature/swish-test-lab-apk, integration/swish-test-lab-apk-main]
    paths:
      - 'app.config.js'
      - 'test-lab-app/**'
      - '.github/workflows/test-lab-apk.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'niche-modules.json'
      - 'services/**'
      - 'constants/niches.ts'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build-test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: bash scripts/install-dependencies.sh
      - name: Configure isolated Test Lab app
        env:
          SWISH_TEST_LAB: '1'
        run: pnpm exec expo config --type public
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu images already provide ANDROID_HOME and current
      # command-line tools. Do not use setup-android@v3: it tries to install
      # the removed legacy SDK package named "tools", which breaks the job.
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate isolated Test Lab Android project
        env:
          SWISH_TEST_LAB: '1'
          EXPO_NO_DOTENV: '1'
        run: pnpm exec expo prebuild --platform android --clean
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: swish-test-lab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
