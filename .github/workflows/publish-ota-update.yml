name: Publish SWISH OTA update

on:
  push:
    branches:
      - main
    # Publish only JavaScript/assets that remain compatible with an installed native runtime.
    # Native config, SDK, dependency and release-workflow changes require a new APK first.
    paths:
      - 'app/**'
      - 'components/**'
      - 'contexts/**'
      - 'constants/**'
      - 'hooks/**'
      - 'services/**'
      - 'shared/**'
      - 'template/**'
      - 'utils/**'
      - 'assets/**'
      - 'niche-modules.json'
      # Include this workflow file so a safety-gate change can supersede an obsolete run.
      - '.github/workflows/publish-ota-update.yml'
      # Test fixtures, documentation and backend-only changes must never publish OTA.
      - '!**/__tests__/**'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!supabase/**'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Avoid overlapping matrix publishes against the same EAS project and API.
concurrency:
  group: swish-ota-publish-${{ github.ref }}
  # A newer main commit supersedes an older publish. The runtime-change gate below
  # ensures a workflow-only safety update cancels old work but does not publish.
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Confirm OTA-compatible runtime changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Check out the exact push range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on actual runtime files
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          printf 'Changed files:\n%s\n' "$changed_files"
          should_publish=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              app/*|components/*|contexts/*|constants/*|hooks/*|services/*|shared/*|template/*|utils/*|assets/*|niche-modules.json)
                case "$file" in
                  */__tests__/*|*.test.*|*.spec.*|*.md) continue ;;
                esac
                should_publish=true
                ;;
            esac
          done <<< "$changed_files"

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          if [[ "$should_publish" == "true" ]]; then
            echo "Compatible application runtime changes detected."
          else
            echo "No compatible application runtime changes; OTA publish jobs will be skipped."
          fi

  publish-update:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_publish == 'true'
    name: Publish ${{ matrix.niche }} JavaScript update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        niche: [master, coins, motocross, bicycles, clothing, surplus_flip, trading_cards, antiques, fossils, beauty, tech]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      SWISH_NICHE: ${{ matrix.niche != 'master' && matrix.niche || '' }}
      SWISH_MASTER_ADMIN: ${{ matrix.niche == 'master' && '1' || '0' }}
      SWISH_OTA_PUBLISH: '1'
      SWISH_CHANNEL: ${{ matrix.niche == 'master' && 'production-default' || format('production-{0}', matrix.niche) }}
      EXPO_NO_DOTENV: "1"
    steps:
      - name: Skip safely until Expo credentials are configured
        if: ${{ env.EXPO_TOKEN == '' || env.EXPO_PROJECT_ID == '' }}
        run: |
          echo "::warning::OTA publishing skipped. Configure repository variable EXPO_PROJECT_ID and repository secret EXPO_TOKEN."
          echo "The installed APK will not receive OTA updates until an OTA-enabled APK is installed and these settings are configured."

      - name: Check out SWISH
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: bash scripts/install-dependencies.sh

      - name: Gate OTA on typecheck and tests
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          npx tsc --noEmit
          npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand

      - name: Validate Expo OTA configuration
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          pnpm exec expo config --type public --json > /tmp/swish-expo-config.json
          if ! node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json','utf8')); const expected=process.env.SWISH_CHANNEL; if (!c.updates?.url?.includes(process.env.EXPO_PROJECT_ID) || !c.runtimeVersion || c.updates?.requestHeaders?.['expo-channel-name'] !== expected) { console.error('OTA configuration missing expected project/runtime/channel'); process.exit(1); }"; then
            echo "Expo config output (first 40 lines):"
            head -40 /tmp/swish-expo-config.json
            exit 1
          fi

      - name: Ensure OTA branch and channel are linked
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          BRANCH="$SWISH_CHANNEL"
          CHANNEL="$SWISH_CHANNEL"

          if ! npx eas-cli@latest branch:view "$BRANCH" --non-interactive >/dev/null 2>&1; then
            npx eas-cli@latest branch:create "$BRANCH" --non-interactive
          fi

          if ! npx eas-cli@latest channel:view "$CHANNEL" --non-interactive >/dev/null 2>&1; then
            npx eas-cli@latest channel:create "$CHANNEL" --non-interactive
          fi

          npx eas-cli@latest channel:edit "$CHANNEL" --branch "$BRANCH" --non-interactive

      - name: Publish app-specific update
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: npx eas-cli@latest update --branch "$SWISH_CHANNEL" --message "SWISH $SWISH_CHANNEL OTA update $GITHUB_SHA" --non-interactive
