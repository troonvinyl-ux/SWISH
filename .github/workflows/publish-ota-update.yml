name: Publish SWISH OTA update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-update:
    name: Publish ${{ matrix.niche }} JavaScript update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        niche: [coins, motocross, bicycles, clothing, surplus_flip]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
    steps:
      - name: Skip safely until Expo credentials are configured
        if: ${{ env.EXPO_TOKEN == '' || env.EXPO_PROJECT_ID == '' }}
        run: |
          echo "::warning::OTA publishing skipped. Configure repository variable EXPO_PROJECT_ID and repository secret EXPO_TOKEN."
          echo "The installed APK will not receive OTA updates until an OTA-enabled APK is installed and these settings are configured."

      - name: Check out SWISH
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Install dependencies
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: bash scripts/install-dependencies.sh

      - name: Gate OTA on typecheck and tests
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          npx tsc --noEmit
          npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand

      - name: Validate Expo OTA configuration
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        env:
          SWISH_NICHE: ${{ matrix.niche }}
          EXPO_NO_DOTENV: "1"
        run: |
          # Request machine-readable JSON explicitly; the default Expo config
          # output is JavaScript-like inspection text and cannot be JSON.parse'd.
          pnpm exec expo config --type public --json > /tmp/swish-expo-config.json
          if ! node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json','utf8')); const expected='production-'+process.env.SWISH_NICHE; if (!c.updates?.url?.includes(process.env.EXPO_PROJECT_ID) || !c.runtimeVersion || c.updates?.requestHeaders?.['expo-channel-name'] !== expected) { console.error('OTA configuration missing expected project/runtime/channel'); process.exit(1); }"; then
            echo "Expo config output (first 40 lines):"
            head -40 /tmp/swish-expo-config.json
            exit 1
          fi

      - name: Ensure OTA branch and channel are linked
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        env:
          SWISH_NICHE: ${{ matrix.niche }}
        run: |
          BRANCH="production-${SWISH_NICHE}"
          CHANNEL="$BRANCH"

          # Create branch/channel if missing; otherwise reuse the existing object.
          if ! npx eas-cli@latest branch:view "$BRANCH" --non-interactive >/dev/null 2>&1; then
            npx eas-cli@latest branch:create "$BRANCH" --non-interactive
          fi

          if ! npx eas-cli@latest channel:view "$CHANNEL" --non-interactive >/dev/null 2>&1; then
            npx eas-cli@latest channel:create "$CHANNEL" --non-interactive
          fi

          # Ensure this channel serves the corresponding niche branch.
          npx eas-cli@latest channel:edit "$CHANNEL" --branch "$BRANCH" --non-interactive

      - name: Publish niche-specific update
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        env:
          SWISH_NICHE: ${{ matrix.niche }}
          SWISH_OTA_PUBLISH: '1'
        run: npx eas-cli@latest update --branch "production-${SWISH_NICHE}" --message "SWISH ${SWISH_NICHE} OTA update ${GITHUB_SHA}" --non-interactive
