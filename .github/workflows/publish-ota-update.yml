name: Publish SWISH OTA update

on:
  push:
    branches:
      - main
    # Publish only JavaScript/assets that remain compatible with an installed native runtime.
    # Native config, SDK, dependency and release-workflow changes require a new APK first.
    paths:
      - 'app/**'
      - 'components/**'
      - 'contexts/**'
      - 'constants/**'
      - 'hooks/**'
      - 'services/**'
      - 'shared/**'
      - 'template/**'
      - 'utils/**'
      - 'assets/**'
      - 'niche-modules.json'
      - 'scripts/prepare-niche-assets.mjs'
      - 'scripts/verify-ota-runtime-compatibility.mjs'
      # Include this workflow file so a safety-gate change can supersede an obsolete run.
      - '.github/workflows/publish-ota-update.yml'
      # Test fixtures, documentation and backend-only changes must never publish OTA.
      - '!**/__tests__/**'
      - '!**/*.test.*'
      - '!**/*.spec.*'
      - '!supabase/**'
      - '!docs/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

# Avoid overlapping matrix publishes against the same EAS project and API.
concurrency:
  group: swish-ota-publish-${{ github.ref }}
  # A newer main commit supersedes an older publish. The runtime-change gate below
  # ensures a workflow-only safety update cancels old work but does not publish.
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Confirm OTA-compatible runtime changes
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - name: Check out the exact push range
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on actual runtime files
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-ota-runtime-compatibility.mjs

  publish-update:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_publish == 'true'
    name: Publish ${{ matrix.niche }} JavaScript update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        niche: [master, coins, motocross, bicycles, clothing, surplus_flip, trading_cards, antiques, fossils, beauty, tech, collectibles]
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      SWISH_NICHE: ${{ matrix.niche != 'master' && matrix.niche || '' }}
      SWISH_MASTER_ADMIN: ${{ matrix.niche == 'master' && '1' || '0' }}
      SWISH_OTA_PUBLISH: '1'
      SWISH_CHANNEL: ${{ matrix.niche == 'master' && 'production-default' || format('production-{0}', matrix.niche) }}
      EXPO_NO_DOTENV: "1"
    steps:
      - name: Skip safely until Expo credentials are configured
        if: ${{ env.EXPO_TOKEN == '' || env.EXPO_PROJECT_ID == '' }}
        run: |
          echo "::warning::OTA publishing skipped. Configure repository variable EXPO_PROJECT_ID and repository secret EXPO_TOKEN."
          echo "The installed APK will not receive OTA updates until an OTA-enabled APK is installed and these settings are configured."

      - name: Check out SWISH
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: bash scripts/install-dependencies.sh

      - name: Gate OTA on typecheck and tests
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          npx tsc --noEmit
          npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand

      - name: Prepare niche-only brand artwork
        if: ${{ matrix.niche != 'master' }}
        env:
          SWISH_NICHE: ${{ matrix.niche }}
        run: node scripts/prepare-niche-assets.mjs
      - name: Validate Expo OTA configuration
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          pnpm exec expo config --type public --json > /tmp/swish-expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json', 'utf8'));
          const niche = process.env.SWISH_NICHE;
          const master = process.env.SWISH_MASTER_ADMIN === '1';
          const version = c.version || '1.0.0';
          const expectedRuntime = master ? version + '-master-admin-api36-v1' : version + '-' + niche + '-isolated-api36-v1';
          if (!c.updates?.url?.includes(process.env.EXPO_PROJECT_ID)) throw new Error('OTA project ID mismatch');
          if (c.runtimeVersion !== expectedRuntime) throw new Error('OTA runtime version mismatch for target ' + (master ? 'Master Admin' : niche));
          if (c.updates?.requestHeaders?.['expo-channel-name'] !== process.env.SWISH_CHANNEL) throw new Error('OTA channel does not match target app');
          if (!master && c.extra?.swishNicheId !== niche) throw new Error('OTA niche identity mismatch');
          NODE

      - name: Ensure OTA branch and channel are linked
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: |
          BRANCH="$SWISH_CHANNEL"
          CHANNEL="$SWISH_CHANNEL"

          if ! npx --yes eas-cli@27.2.0 branch:view "$BRANCH" --non-interactive >/dev/null 2>&1; then
            npx --yes eas-cli@27.2.0 branch:create "$BRANCH" --non-interactive
          fi

          if ! npx --yes eas-cli@27.2.0 channel:view "$CHANNEL" --non-interactive >/dev/null 2>&1; then
            npx --yes eas-cli@27.2.0 channel:create "$CHANNEL" --non-interactive
          fi

          npx --yes eas-cli@27.2.0 channel:edit "$CHANNEL" --branch "$BRANCH" --non-interactive

      - name: Publish app-specific update
        if: ${{ env.EXPO_TOKEN != '' && env.EXPO_PROJECT_ID != '' }}
        run: npx --yes eas-cli@27.2.0 update --branch "$SWISH_CHANNEL" --message "SWISH $SWISH_CHANNEL OTA update $GITHUB_SHA" --non-interactive
