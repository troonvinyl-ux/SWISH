name: Publish SWISH OTA Update

on:
  workflow_dispatch:
    inputs:
      target:
        description: App channel to update
        required: true
        type: choice
        options:
          - master
          - coins
          - motocross
          - bicycles
          - clothing
          - surplus_flip
          - trading_cards
          - antiques
          - fossils
          - beauty
          - tech
          - collectibles
      message:
        description: Short release note shown in the update
        required: true
        type: string
        default: SWISH improvements

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      OTA_MESSAGE: ${{ inputs.message }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      SWISH_NICHE: ${{ inputs.target != 'master' && inputs.target || '' }}
      SWISH_MASTER_ADMIN: ${{ inputs.target == 'master' && '1' || '0' }}
      SWISH_CHANNEL: ${{ inputs.target == 'master' && 'production-default' || format('production-{0}', inputs.target) }}
      SWISH_OTA_PUBLISH: '1'
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify OTA publishing credentials
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Add EXPO_TOKEN as a repository Actions secret."; exit 1; }
          test -n "$EXPO_PROJECT_ID" || { echo "::error::Add EXPO_PROJECT_ID as a repository Actions variable."; exit 1; }
      - name: Install dependencies
        run: bash scripts/install-dependencies.sh
      - name: Verify APK baseline and native OTA compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_OTA_SAFE: '1'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Manual OTA publishing is restricted to main."; exit 1; }
          node scripts/verify-ota-runtime-compatibility.mjs
      - name: Validate Expo update configuration
        run: |
          npx expo config --type public --json > /tmp/swish-expo-config.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('/tmp/swish-expo-config.json', 'utf8'));
          const niche = process.env.SWISH_NICHE;
          const master = process.env.SWISH_MASTER_ADMIN === '1';
          const version = config.version || '1.0.0';
          const expectedRuntime = master ? version + '-master-admin-api36-v1' : version + '-' + niche + '-isolated-api36-v1';
          if (!config.updates?.url || !config.runtimeVersion) throw new Error('OTA update URL/runtime version missing from Expo config');
          if (config.extra?.eas?.projectId !== process.env.EXPO_PROJECT_ID) throw new Error('Expo project ID mismatch');
          if (config.runtimeVersion !== expectedRuntime) throw new Error('OTA runtime version does not match selected product');
          if (config.updates?.requestHeaders?.['expo-channel-name'] !== process.env.SWISH_CHANNEL) throw new Error('OTA channel does not match selected product');
          if (!master && config.extra?.swishNicheId !== niche) throw new Error('OTA niche identity does not match selected product');
          NODE
      - name: Validate release note
        run: |
          if [ -z "$OTA_MESSAGE" ] || [ "${#OTA_MESSAGE}" -gt 120 ]; then
            echo "::error::Release note must contain 1–120 characters."
            exit 1
          fi
      - name: Publish compatible update
        run: |
          if [ "$SWISH_NICHE" = "" ]; then
            CHANNEL=production-default
          else
            CHANNEL="production-$SWISH_NICHE"
          fi
          npx eas-cli update --channel "$CHANNEL" --message "$OTA_MESSAGE" --non-interactive
