name: Publish approved compatible unified SWISH update
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        required: true
        default: preview-unified
        options: [preview-unified, production-unified]
      platform:
        type: choice
        required: true
        default: android
        options: [android, ios, all]
        description: Android needs only its verified APK; all requires both native baselines
      baseline_run:
        type: string
        required: true
        description: Successful unified native build run ID on main (selected platform artifacts required)
      production_acceptance_run:
        type: string
        required: false
        description: Successful protected current-source production acceptance run (production only)
      message:
        type: string
        required: true
        default: SWISH compatible module update
permissions:
  contents: read
  actions: read
jobs:
  publish:
    environment: swish-ota-approval
    runs-on: ubuntu-latest
    env:
      SWISH_NICHE: ''
      SWISH_MASTER_ADMIN: '0'
      SWISH_TEST_LAB: '0'
      SWISH_OTA_PUBLISH: '1'
      SWISH_OTA_PLATFORM: ${{ inputs.platform }}
      SWISH_RELEASE_CHANNEL: ${{ inputs.channel }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || secrets.EXPO_PROJECT_ID || vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      SWISH_RELEASE_CERT_SHA256: ${{ vars.SWISH_RELEASE_CERT_SHA256 || secrets.SWISH_RELEASE_CERT_SHA256 }}
      SWISH_PRODUCTION_ACCEPTANCE_RUN: ${{ inputs.production_acceptance_run }}
      SWISH_EAS_ENVIRONMENT: ${{ inputs.channel == 'production-unified' && 'production' || 'preview' }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SWISH_BASELINE_RUN: ${{ inputs.baseline_run }}
      OTA_MESSAGE: ${{ inputs.message }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: inputs.platform != 'ios'
      - name: Initialize Android baseline verification tools
        if: inputs.platform != 'ios'
        run: |
          sdkmanager 'build-tools;36.0.0'
          python3 -m venv "$RUNNER_TEMP/apk-inspector"
          "$RUNNER_TEMP/apk-inspector/bin/pip" install androguard==4.1.3
          echo "SWISH_APK_PYTHON=$RUNNER_TEMP/apk-inspector/bin/python" >> "$GITHUB_ENV"
      - run: bash scripts/install-dependencies.sh
      - name: Require approved project, main branch and safe release inputs
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$EXPO_TOKEN" && test -n "$EXPO_PROJECT_ID"
          node --input-type=module -e 'import { selectedOtaPlatforms } from "./scripts/unified-ota-policy.mjs"; selectedOtaPlatforms(process.env.SWISH_OTA_PLATFORM); if(!["preview-unified","production-unified"].includes(process.env.SWISH_RELEASE_CHANNEL)) throw Error("Unknown release channel"); if(!process.env.OTA_MESSAGE?.trim() || process.env.OTA_MESSAGE.length>120) throw Error("Release note must contain 1–120 characters.");'
      - run: node scripts/verify-ota-owner-approval.mjs
      - run: node scripts/verify-expo-project.mjs
      - run: node scripts/verify-production-approval.mjs
      - run: node --test scripts/unified-ota-policy.test.mjs scripts/android-release-policy.test.mjs scripts/release-workflow-contract.test.mjs
      - run: node scripts/generate-unified-route-types.cjs
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx --yes jest@29.7.0 --config jest.config.ci.js --runInBand
      - name: Verify actual selected-platform artifacts and unchanged native fingerprint
        run: npx --yes eas-cli@27.2.0 env:exec "$SWISH_EAS_ENVIRONMENT" --non-interactive 'mkdir -p dist && npx expo config --type public --json > dist/ota-resolved-config.json && node scripts/verify-unified-config.mjs dist/ota-resolved-config.json && node scripts/verify-unified-ota.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: swish-compatible-ota-impact
          path: dist/unified-ota-impact.json
          if-no-files-found: error
      - name: Publish one atomic runtime-compatible bundle only after approval
        run: |
          test -n "$EXPO_TOKEN" && test -n "$EXPO_PROJECT_ID"
          test -n "$OTA_MESSAGE" && test "${#OTA_MESSAGE}" -le 120
          npx --yes eas-cli@27.2.0 update --environment "$SWISH_EAS_ENVIRONMENT" --platform "$SWISH_OTA_PLATFORM" --channel "$SWISH_RELEASE_CHANNEL" --message "$OTA_MESSAGE" --non-interactive --json > dist/unified-ota-publication.json
      - run: node scripts/verify-ota-publication.mjs
      - name: Retain publisher receipts without claiming installed-device acceptance
        if: always() && hashFiles('dist/unified-ota-publication.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: swish-compatible-ota-publication
          path: |
            dist/unified-ota-publication.json
            dist/unified-ota-receipt.json
          retention-days: 90
          if-no-files-found: error
# This workflow is manual only. Configure required reviewers on swish-ota-approval.
