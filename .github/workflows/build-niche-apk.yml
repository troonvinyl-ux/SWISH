name: Build Tunes Flip Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    uses: ./.github/workflows/_niche-android.yml
    with:
      # Keep this release route deliberately single-product.  The reusable
      # workflow creates a physical isolated route tree before compilation.
      niche: tunes_flip
    secrets: inherit
