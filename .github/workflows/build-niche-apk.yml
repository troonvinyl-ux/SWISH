name: Build isolated SWISH niche APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'services/**'
      - 'hooks/**'
      - 'contexts/**'
      - 'components/**'
      - 'constants/**'
      - 'niche-modules.json'
      - 'app.config.js'
      - 'scripts/**'
      - '.github/workflows/_niche-android.yml'
      - '.github/workflows/build-niche-apk.yml'
  workflow_dispatch:
    inputs:
      niche:
        description: Canonical branded application
        required: true
        type: choice
        default: clothing
        options: [coins, motocross, bicycles, clothing, surplus_flip, trading_cards, antiques, fossils, beauty, tech]
permissions:
  contents: read
jobs:
  build-apk:
    uses: ./.github/workflows/_niche-android.yml
    with:
      niche: ${{ inputs.niche || 'clothing' }}
