name: SWISH unified owner and regression readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-checks:
    uses: ./.github/workflows/build-swish-unified.yml
    with:
      build_android: false
      build_ios: false
    secrets: inherit
# Master Admin belongs to the unified shell; no separate owner binary or eleven-app matrix.
