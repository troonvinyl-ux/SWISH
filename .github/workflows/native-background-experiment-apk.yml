name: Build background-removal experiment APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/native-background-removal]
    paths:
      - '.github/workflows/native-background-experiment-apk.yml'
      - 'services/nativeBackgroundCompositor.ts'
      - 'services/nativeSegmentationEngine.ts'
      - 'services/browserBackgroundRemoval.web.ts'
      - 'test-lab-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: bash scripts/install-dependencies.sh
      - name: Validate experiment source
        run: |
          test -f services/nativeBackgroundCompositor.ts
          test -f services/nativeSegmentationEngine.ts
          pnpm exec tsc --noEmit --pretty false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate isolated Test Lab Android project
        env:
          SWISH_TEST_LAB: '1'
          EXPO_NO_DOTENV: '1'
        run: pnpm exec expo prebuild --platform android --clean
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: swish-background-removal-experiment-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
