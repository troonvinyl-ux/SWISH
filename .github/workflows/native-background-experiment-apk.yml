name: Build background-removal experiment APK
on:
  workflow_dispatch:
  push:
    branches: [experiment/native-background-removal]
    paths:
      - '.github/workflows/native-background-experiment-apk.yml'
      - 'services/nativeBackgroundCompositor.ts'
      - 'services/nativeSegmentationEngine.ts'
      - 'services/browserBackgroundRemoval.web.ts'
      - 'test-lab-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.native-background-experiment.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: bash scripts/install-dependencies.sh
      - name: Validate experiment source
        run: |
          test -f services/nativeBackgroundCompositor.ts
          test -f services/nativeSegmentationEngine.ts
          pnpm exec tsc --project tsconfig.native-background-experiment.json --noEmit --pretty false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Generate isolated Test Lab Android project
        env:
          SWISH_TEST_LAB: '1'
          EXPO_NO_DOTENV: '1'
        run: pnpm exec expo prebuild --platform android --clean
      - name: Build self-contained release APK (unsigned, local testing only)
        working-directory: android
        env:
          SWISH_TEST_LAB: '1'
          EXPO_NO_DOTENV: '1'
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
      - name: Sign standalone APK with temporary test certificate
        working-directory: android
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore /tmp/swish-test-lab.jks -alias swish-test-lab -keyalg RSA -keysize 2048 -validity 30 -storepass android -keypass android -dname 'CN=SWISH Test Lab, OU=Testing, O=SWISH, C=GB'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/swish-test-lab-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks /tmp/swish-test-lab.jks --ks-key-alias swish-test-lab --ks-pass pass:android --key-pass pass:android --out app/build/outputs/apk/release/swish-test-lab-standalone.apk app/build/outputs/apk/release/swish-test-lab-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/swish-test-lab-standalone.apk
      - uses: actions/upload-artifact@v4
        with:
          name: swish-background-removal-experiment-standalone-signed-apk
          path: android/app/build/outputs/apk/release/swish-test-lab-standalone.apk
          if-no-files-found: error
          retention-days: 14
