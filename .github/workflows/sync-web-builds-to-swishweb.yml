name: Sync SWISH niche web builds to SwishWeb

on:
  workflow_run:
    workflows: ["SWISH branded web production builds"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful SWISH branded web build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: swish-web-repository-sync
  cancel-in-progress: false

jobs:
  prepare-sync:
    name: Transfer ten niche web exports
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check cross-repository permission
        id: credentials
        env:
          SWISH_WEB_REPO_TOKEN: ${{ secrets.SWISH_WEB_REPO_TOKEN }}
        run: |
          if [ -n "$SWISH_WEB_REPO_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web exports are ready, but transfer is paused. Add SWISH_WEB_REPO_TOKEN to SWISH repository Actions secrets with Contents read/write and Pull requests read/write access to troonvinyl-ux/SwishWeb."
          fi

      - name: Download all ten niche exports
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pattern: swish-web-*
          path: web-artifacts
          merge-multiple: false

      - name: Validate all ten exports
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          niches=(coins motocross bicycles clothing surplus_flip antiques fossils trading_cards beauty tech)
          for niche in "${niches[@]}"; do
            test -s "web-artifacts/swish-web-$niche/index.html" || {
              echo "::error::Missing index.html for $niche export"
              exit 1
            }
          done

      - name: Check out SwishWeb
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: troonvinyl-ux/SwishWeb
          ref: main
          token: ${{ secrets.SWISH_WEB_REPO_TOKEN }}
          path: swish-web-repo

      - name: Stage niche exports without touching application source
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          niches=(coins motocross bicycles clothing surplus_flip antiques fossils trading_cards beauty tech)
          for niche in "${niches[@]}"; do
            destination="swish-web-repo/public/niche-apps/$niche"
            mkdir -p "$destination"
            find "$destination" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "web-artifacts/swish-web-$niche/." "$destination/"
            test -s "$destination/index.html"
          done

      - name: Create update pull request in SwishWeb
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.SWISH_WEB_REPO_TOKEN }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd swish-web-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="automation/swish-niche-web-builds"
          git fetch origin main
          git checkout -B "$branch" origin/main
          git add public/niche-apps
          if git diff --cached --quiet; then
            echo "No web export changes to transfer."
            exit 0
          fi
          git commit -m "chore: update ten SWISH niche web exports"
          git push --force origin "$branch"
          create_deployment_pr() {
            gh pr create \
              --repo troonvinyl-ux/SwishWeb \
              --base main \
              --head "$branch" \
              --title "Update all ten SWISH niche web apps" \
              --body "Automated static exports from SWISH commit $SOURCE_SHA. The ten niche apps are staged under public/niche-apps/ without replacing SwishWeb source files. Merge after the SwishWeb build checks pass."
          }

          if pr_json=$(gh pr view "$branch" --repo troonvinyl-ux/SwishWeb --json state,mergedAt 2>/dev/null); then
            pr_state=$(printf '%s' "$pr_json" | jq -r '.state')
            pr_merged_at=$(printf '%s' "$pr_json" | jq -r '.mergedAt // empty')
            if [[ "$pr_state" == "OPEN" ]]; then
              echo "Updated existing open SwishWeb deployment PR."
            elif [[ -n "$pr_merged_at" ]]; then
              echo "Previous deployment PR was merged; opening a fresh PR for this export batch."
              create_deployment_pr
            else
              echo "Reopening the previously closed SwishWeb deployment PR."
              gh pr reopen "$branch" --repo troonvinyl-ux/SwishWeb
            fi
          else
            create_deployment_pr
          fi
